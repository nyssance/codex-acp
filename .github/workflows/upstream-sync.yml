name: Upstream Sync
on:
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge upstream into a review branch
        id: merge
        run: |
          set -euo pipefail
          git fetch https://github.com/agentclientprotocol/codex-acp.git main
          upstream_revision=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream_revision" HEAD; then
            echo "Already synchronized"
            exit 0
          fi
          base_revision=$(git rev-parse HEAD)
          branch="upstream-sync/${upstream_revision:0:12}-${base_revision:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin "refs/heads/$branch"; then
            git fetch origin "$branch"
            git switch -c "$branch" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git switch -c "$branch"
            if ! git merge --no-edit "$upstream_revision"; then
              echo '::error::Upstream merge conflicts require manual resolution. No branch was pushed or package published.'
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.merge.outputs.branch != ''
        with:
          bun-version: latest
      - name: Verify merged source
        if: steps.merge.outputs.branch != ''
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
      - name: Open review PR
        if: always() && steps.merge.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          count=$(gh pr list --head "$SYNC_BRANCH" --base main --json number --jq length)
          if [ "$count" = 0 ]; then
            gh pr create --head "$SYNC_BRANCH" --base main --title 'chore: synchronize official codex-acp upstream' --body 'Merge official upstream history. Check typecheck and non-live unit test results in the Upstream Sync run before merging. Review ALwith extension compatibility and publishing workflow changes before merging. This PR does not authorize a release.'
          fi
